<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FOLD 任務看板：以拖曳整理任務、掌握優先順序的極簡 Kanban 工作區。"
    />
    <title>FOLD · 任務看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/" aria-label="FOLD 任務看板首頁">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
          </span>
          <span class="brand-copy">
            <strong>FOLD</strong>
            <small>task atelier</small>
          </span>
        </a>

        <div class="sidebar-section">
          <div class="sidebar-heading">
            <span>你的看板</span>
            <button
              class="icon-button icon-button-light"
              type="button"
              data-action="new-board"
              data-testid="new-board-sidebar"
              aria-label="新增看板"
              title="新增看板"
            >
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            </button>
          </div>
          <nav class="board-list" id="board-list" aria-label="看板清單"></nav>
        </div>

        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-index">01</span>
            <p>拖曳卡片，讓任務自然流向完成。</p>
          </div>
          <div class="sidebar-signature">
            <span>RUST + SQLITE</span>
            <span>SPRINT / 2026</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button mobile-menu"
              type="button"
              data-action="toggle-sidebar"
              aria-label="開啟看板選單"
            >
              <svg class="icon" aria-hidden="true"><use href="#icon-menu"></use></svg>
            </button>
            <span class="eyebrow" id="today-label">TODAY</span>
            <span class="topbar-slash">/</span>
            <span class="topbar-mode">工作區</span>
            <span class="live-status" id="live-status" data-state="connecting" title="即時連線狀態">
              <span class="live-dot"></span>
              LIVE
            </span>
          </div>

          <div class="topbar-actions">
            <label class="search-box" for="search-input">
              <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
              <input
                id="search-input"
                type="search"
                placeholder="搜尋任務"
                autocomplete="off"
                spellcheck="false"
                aria-label="搜尋任務"
              />
              <kbd>/</kbd>
            </label>
            <label class="filter-box" for="label-filter">
              <svg class="icon" aria-hidden="true"><use href="#icon-tag"></use></svg>
              <select id="label-filter" aria-label="依標籤篩選">
                <option value="">所有標籤</option>
              </select>
            </label>
            <button
              class="button button-ghost"
              type="button"
              data-action="new-column"
              data-testid="add-column"
            >
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
              新增欄位
            </button>
            <button
              class="button button-primary"
              type="button"
              data-action="new-task"
              data-testid="add-task-top"
            >
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
              新增任務
            </button>
          </div>
        </header>

        <section class="view" id="view" aria-live="polite"></section>
      </main>
    </div>

    <button
      class="sidebar-scrim"
      type="button"
      data-action="toggle-sidebar"
      aria-label="關閉看板選單"
      tabindex="-1"
    ></button>

    <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24">
        <circle cx="6" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="18" cy="12" r="1" />
      </symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24">
        <path d="M4 4h7l9 9-7 7-9-9V4Z" />
        <circle cx="8.5" cy="8.5" r="1.2" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect x="4" y="6" width="16" height="14" rx="2" />
        <path d="M8 3v5M16 3v5M4 11h16" />
      </symbol>
      <symbol id="icon-grip" viewBox="0 0 24 24">
        <circle cx="9" cy="7" r="1" />
        <circle cx="15" cy="7" r="1" />
        <circle cx="9" cy="12" r="1" />
        <circle cx="15" cy="12" r="1" />
        <circle cx="9" cy="17" r="1" />
        <circle cx="15" cy="17" r="1" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" />
      </symbol>
    </svg>

    <script src="/task-logic.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
