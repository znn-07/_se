<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大學校務系統</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- 登入畫面 -->
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-badge">🏛</div>
      <h1>大學校務系統</h1>
      <p class="login-sub">National Quemoy University<br />校務行政資訊入口</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>帳號</span>
          <input type="text" id="login-username" placeholder="例如 admin / T001 / S001" required />
        </label>
        <label class="field">
          <span>密碼</span>
          <input type="password" id="login-password" placeholder="預設 1111" required />
        </label>
        <p id="login-error" class="error-msg" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">登入</button>
      </form>
      <div class="login-hint">
        示範帳號（密碼皆為 <code>1111</code>）：
        <div><b>admin</b> 教務處　<b>T001</b> 教師　<b>S001</b> 學生</div>
      </div>
    </div>
  </section>

  <!-- 主介面 -->
  <div id="app-screen" class="app" hidden>
    <header class="topbar">
      <div class="brand">🏛 大學校務系統 <span class="semester" id="semester-label"></span></div>
      <div class="user-box">
        <span class="role-badge" id="role-badge"></span>
        <span id="user-name"></span>
        <button class="btn btn-ghost" id="logout-btn">登出</button>
      </div>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- 通用編輯彈窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal">
      <h3 id="modal-title"></h3>
      <form id="modal-form"></form>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="modal">取消</button>
        <button class="btn btn-primary" type="submit" form="modal-form" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
